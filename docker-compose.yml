services:
  # 1. Python ML Prediction Engine (FastAPI)
  disaster-response-ml:
    build:
      context: ./disaster-response-ml
      dockerfile: Dockerfile
    container_name: crisis_hub_ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
    networks:
      - crisis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Node.js Express Operations & Ingestion Backend
  disaster-response-backend:
    build:
      context: ./disaster-response-backend
      dockerfile: Dockerfile
    container_name: crisis_hub_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - ML_SERVICE_URL=http://disaster-response-ml:8000
    depends_on:
      disaster-response-ml:
        condition: service_healthy
    networks:
      - crisis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. Production Vite Nginx Frontend
  disaster-response-frontend:
    build:
      context: ./disaster-response-frontend
      dockerfile: Dockerfile
    container_name: crisis_hub_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      disaster-response-backend:
        condition: service_healthy
    networks:
      - crisis-network

networks:
  crisis-network:
    driver: bridge
